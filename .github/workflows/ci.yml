name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # No lockfile yet: the verifier ^0.4.0 dependency (the producer
      # surface) resolves from the registry once its staged release is
      # approved. The lockfile + frozen install land with the first green
      # run after that approval.
      - name: Install
        run: npm install

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (content boundary)
        run: npm pack --dry-run
