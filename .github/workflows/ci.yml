name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 45090500067: slowest green 9s; under 2.5 minutes, so the 5-minute floor.
    outputs:
      node_matrix: ${{ steps.matrix.outputs.node_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared reader
        run: scripts/toolchain.sh --self-test
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"
      - name: Compose the qualification matrix
        id: matrix
        env:
          NODE: ${{ steps.versions.outputs.nodejs }}
          NODE_LANES: ${{ steps.versions.outputs.nodejs_lanes }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          lanes = [{"lane": "primary", "node": os.environ["NODE"]}]
          lanes.extend({"lane": "minimum", "node": node} for node in json.loads(os.environ["NODE_LANES"]))
          print("node_matrix=" + json.dumps({"include": lanes}, separators=(",", ":")))
          PYTHON

  workflow-syntax:
    timeout-minutes: 5 # Run 45295888027: slowest green 22s; under 2.5 minutes, so the 5-minute floor.
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go runtime drift
        env:
          EXPECTED_GO: ${{ steps.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed "golang=$EXPECTED_GO"

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    timeout-minutes: 5 # Run 45295888027: slowest green 38s; under 2.5 minutes, so the 5-minute floor.
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      # A shallow checkout omits commits that the secret scan must inspect.
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go runtime drift
        env:
          EXPECTED_GO: ${{ steps.toolchain.outputs.golang }}
        run: scripts/toolchain.sh --installed "golang=$EXPECTED_GO"

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  verify:
    needs: toolchain
    name: typecheck, test, build (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44077968032: the slowest source lane took 39s; under 2.5 minutes, so the 5-minute floor for short jobs.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.node_matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Audit high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Check source and the packed package
        run: |
          npm run typecheck
          npm run test
          npm run build
          npm run check:reference
          npm run check:package
      - name: Check the same archive against the verifier candidate
        run: npm run check:verifier

  site:
    name: Typecheck and build the static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 42651100641: the former Pages build took 17s; under 2.5 minutes, so the 5-minute floor for short jobs.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Install with the frozen lockfile
        run: npm ci
      - name: Typecheck the site
        run: npm run typecheck:web
      - name: Build the site
        run: npm run build:site

  qualified:
    if: always()
    needs: [toolchain, workflow-syntax, secret-scan, verify, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44190210592: slowest green 5s; under 2.5 minutes, so the 5-minute floor.
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
