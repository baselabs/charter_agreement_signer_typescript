name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44077968032: the slowest source lane took 39s; under 2.5 minutes, so the 5-minute floor for short jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: primary
            node: ""
          - lane: minimum
            node: "24.8.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact Node pin
        id: runtime
        env:
          COMPATIBILITY_NODE: ${{ matrix.node }}
        run: |
          version="${COMPATIBILITY_NODE:-$(awk '$1 == "nodejs" {print $2}' .tool-versions)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Node requires an exact pin"; exit 1; }
          echo "node=$version" >> "$GITHUB_OUTPUT"
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false
      - name: Refuse a different Node version
        env:
          EXPECTED_NODE: ${{ steps.runtime.outputs.node }}
        run: |
          test "$(node --version)" = "v$EXPECTED_NODE" || { echo "::error::Node must be exactly $EXPECTED_NODE"; exit 1; }
      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Check source and the packed package
        run: |
          npm run typecheck
          npm run test
          npm run build
          npm run check:reference
          npm run check:package
      - name: Check the same archive against the verifier candidate
        run: npm run check:verifier

  site:
    name: Typecheck and build the static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 42651100641: the former Pages build took 17s; under 2.5 minutes, so the 5-minute floor for short jobs.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node from the tool versions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Refuse a different Node version
        run: |
          expected="$(awk '$1 == "nodejs" {print $2}' .tool-versions)"
          test "$(node --version)" = "v$expected" || { echo "::error::Node must be exactly $expected"; exit 1; }
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Typecheck the site
        run: npm run typecheck:web
      - name: Build the site
        run: npm run build:site

  qualified:
    if: always()
    needs: [verify, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44190210592: slowest green 5s; under 2.5 minutes, so the 5-minute floor.
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
