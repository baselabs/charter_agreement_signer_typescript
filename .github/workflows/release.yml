# npm releases of @charter-agreement-protocol/signer. Publishing is bound to
# THIS repository's workflow identity (GitHub Actions OIDC, no long-lived
# token): the workflow STAGES the artifact (npm stage publish, provenance
# attached) and a human approves the staged release on npmjs.com under 2FA.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify then publish to npm (provenance-bound)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (content boundary)
        run: npm pack --dry-run

      - name: Check registry for existing version
        id: existing
        run: |
          if npm view "@charter-agreement-protocol/signer@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage publish to npm with provenance (human approval required)
        if: steps.existing.outputs.published == 'false'
        run: npm stage publish --provenance
